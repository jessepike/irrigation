<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pike Irrigation">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pike Irrigation</title>
<style>
  :root {
    --bg: #0b1410;
    --panel: #142420;
    --panel-2: #1c2f29;
    --line: #2a4039;
    --text: #e8f0ec;
    --muted: #8aa39b;
    --accent: #4ade80;
    --warn: #f59e0b;
    --danger: #ef4444;
    --danger-bg: #2a1414;
    --warn-bg: #2a2014;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f8f6; --panel: #fff; --panel-2: #ecf3ef; --line: #d8e3dd;
      --text: #0f1f1a; --muted: #5a6e67; --accent: #16a34a; --warn: #b45309;
      --danger: #b91c1c; --danger-bg: #fef2f2; --warn-bg: #fffbeb;
      --shadow: 0 1px 0 rgba(0,0,0,.03), 0 1px 2px rgba(0,0,0,.06);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    min-height: 100dvh;
    padding-bottom: 76px; /* room for bottom nav */
  }
  header.app {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 14px 12px; box-shadow: var(--shadow);
  }
  header.app .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  .subtle { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; color: var(--muted); padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .pill.danger { color: var(--danger); border-color: var(--danger); }
  main { padding: 14px; max-width: 720px; margin: 0 auto; }

  /* Bottom nav */
  nav.bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -1px 6px rgba(0,0,0,.2);
  }
  nav.bottomnav button {
    flex: 1; background: transparent; border: 0; color: var(--muted);
    font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
    padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    letter-spacing: .3px;
  }
  nav.bottomnav button.active { color: var(--accent); }
  nav.bottomnav button .icon { font-size: 18px; line-height: 1; }
  nav.bottomnav button .badge {
    display: none; position: absolute; top: 4px; transform: translateX(14px);
    background: var(--danger); color: white; font-size: 9px; font-weight: 800;
    padding: 1px 5px; border-radius: 999px; min-width: 16px; text-align: center;
  }
  nav.bottomnav button[data-view="conflicts"] { position: relative; }
  nav.bottomnav button[data-view="conflicts"].has-conflicts .badge { display: inline-block; }

  /* View visibility */
  section.view { display: none; }
  section.view.active { display: block; }

  /* Section headers within views */
  .section-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 14px 4px 8px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* Cards */
  ul.cards { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li.card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  li.card.danger { border-color: var(--danger); background: var(--danger-bg); }
  li.card.warn { border-color: var(--warn); background: var(--warn-bg); }
  li.card .title { font-weight: 600; font-size: 15px; }
  li.card .meta { color: var(--muted); font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* Today view - timeline */
  .tl-hour {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 16px 4px 6px;
  }
  .tl-hour.now { color: var(--accent); }
  .event {
    display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 6px; box-shadow: var(--shadow);
    position: relative;
  }
  .event.now-event { box-shadow: 0 0 0 2px var(--accent); }
  .event.has-conflict { border-color: var(--danger); background: linear-gradient(0deg, var(--danger-bg), var(--panel) 70%); }
  .event.warn-conflict { border-color: var(--warn); }
  .event .time-col .time { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }
  .event .time-col .time-end { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .event .body .name { font-weight: 600; font-size: 14px; }
  .event .body .ctx { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .event .right { text-align: right; }
  .event .dur { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .event .duration-budgeted { color: var(--muted); font-size: 11px; }
  .now-tag {
    display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 4px;
    background: var(--accent); color: var(--bg); margin-left: 6px; letter-spacing: .5px; font-weight: 800;
  }

  /* Gantt view */
  .gantt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  .gantt { min-width: 980px; display: flex; flex-direction: column; gap: 4px; }
  .gantt-axis-row {
    display: grid; grid-template-columns: 130px 1fr; gap: 6px;
    margin-bottom: 2px;
  }
  .gantt-axis-spacer { /* aligns with label column */ }
  .gantt-axis-hours {
    display: grid; grid-template-columns: repeat(24, 1fr);
    font-size: 10px; color: var(--muted);
    padding-bottom: 4px; border-bottom: 1px dashed var(--line);
  }
  .gantt-axis-hours span {
    padding: 2px 4px; border-left: 1px solid var(--line);
    text-align: left;
  }
  .gantt-axis-hours span:first-child { border-left: 0; }
  .gantt-row {
    display: grid; grid-template-columns: 130px 1fr; gap: 6px;
    align-items: stretch;
  }
  .gantt-label {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gantt-track {
    position: relative; height: 36px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    background-image: repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(100%/24 - 1px),
      var(--line) calc(100%/24 - 1px),
      var(--line) calc(100%/24)
    );
  }
  .gantt-block {
    position: absolute; top: 3px; bottom: 3px;
    background: var(--accent); border-radius: 4px;
    color: var(--bg); font-size: 10px; font-weight: 700;
    padding: 2px 4px; overflow: hidden; white-space: nowrap;
    display: flex; align-items: center;
    box-sizing: border-box;
    min-width: 4px;
  }
  .gantt-block.conflict { background: var(--danger); color: white; }
  .gantt-block.warn { background: var(--warn); color: var(--bg); }
  .view-toggle {
    display: inline-flex; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 2px; margin: 8px 0;
  }
  .view-toggle button {
    padding: 7px 14px; font: inherit; font-size: 12px; color: var(--muted);
    background: transparent; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .view-toggle button.active { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }

  /* Conflicts view */
  .conflict-card {
    border-left: 4px solid var(--danger);
  }
  .conflict-card.warn { border-left-color: var(--warn); }
  .conflict-card .pair {
    display: flex; align-items: center; gap: 8px; margin-top: 6px;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .conflict-card .arrow { color: var(--muted); }
  .conflict-card .gap-label {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--danger); color: white; font-size: 11px; font-weight: 700;
    margin-top: 6px;
  }
  .conflict-card.warn .gap-label { background: var(--warn); color: var(--bg); }

  /* Controllers view */
  .ctl-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .ctl-card.placeholder { opacity: .55; border-style: dashed; }
  .ctl-card h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .ctl-card .ctl-type {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); font-weight: 700;
    letter-spacing: .5px;
  }
  .ctl-card .ctl-type.rainbird { color: var(--warn); border-color: var(--warn); }
  .program-block { margin-top: 10px; padding: 10px; background: var(--panel-2); border-radius: 8px; }
  .program-block .pname { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .program-block .pdetail { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .program-block .pzones { font-size: 12px; margin-top: 6px; }
  .program-block .pzones .zone {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--line); margin: 2px 4px 2px 0;
    font-variant-numeric: tabular-nums; font-size: 11px;
  }
  .program-block .pzones .zone.skip { opacity: .5; text-decoration: line-through; }
  .ctl-summary {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    font-size: 11px; color: var(--muted);
  }
  .ctl-summary .stat {
    background: var(--panel-2); padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }

  /* Checklist view */
  .season-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .season-tabs button {
    flex: 1; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); font: inherit; font-weight: 600; font-size: 13px;
    cursor: pointer; min-width: 80px;
  }
  .season-tabs button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .checklist-progress {
    font-size: 12px; color: var(--muted); margin: 10px 4px;
  }
  .check-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px;
    cursor: pointer;
  }
  .check-item.done { background: var(--panel-2); }
  .check-item.done .text { text-decoration: line-through; color: var(--muted); }
  .check-item .cb {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; margin-top: 1px;
    border: 2px solid var(--line); display: grid; place-items: center;
  }
  .check-item.done .cb { background: var(--accent); border-color: var(--accent); }
  .check-item .cb svg { width: 14px; height: 14px; color: var(--bg); opacity: 0; }
  .check-item.done .cb svg { opacity: 1; }
  .check-item .text { font-size: 14px; line-height: 1.35; }
  .check-item .scope-tag {
    font-size: 10px; color: var(--muted); margin-top: 3px;
    text-transform: uppercase; letter-spacing: .8px; font-weight: 600;
  }
  .check-group {
    margin-top: 14px;
  }
  .check-group .group-name {
    font-size: 13px; font-weight: 700; margin-bottom: 6px; padding: 0 4px;
  }

  /* Loading */
  .loading {
    display: grid; place-items: center; padding: 60px 20px; color: var(--muted);
    text-align: center;
  }
  .loading .spinner {
    width: 28px; height: 28px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer note */
  footer.foot {
    color: var(--muted); font-size: 11px; text-align: center; padding: 18px 14px 8px;
  }
</style>
</head>
<body>
<header class="app">
  <div class="row">
    <h1>Pike Irrigation</h1>
    <span id="conflictPill" class="pill"></span>
  </div>
  <div class="subtle" style="margin-top:2px"><span id="dateLabel"></span> · <span id="clockLabel"></span></div>
</header>

<main>
  <section class="view active" id="today-view">
    <div class="loading"><div class="spinner"></div>Loading schedule…</div>
  </section>
  <section class="view" id="conflicts-view"></section>
  <section class="view" id="controllers-view"></section>
  <section class="view" id="checklist-view"></section>
</main>

<nav class="bottomnav">
  <button data-view="today" class="active"><span class="icon">📅</span><span>Today</span></button>
  <button data-view="conflicts"><span class="icon">⚠️</span><span>Conflicts</span><span class="badge">0</span></button>
  <button data-view="controllers"><span class="icon">🔧</span><span>Controllers</span></button>
  <button data-view="checklist"><span class="icon">✅</span><span>Checklist</span></button>
</nav>

<footer class="foot">
  <div id="dataInfo"></div>
</footer>

<script>
// ==================== Data load ====================
let CONTROLLERS = [];
let CHECKLIST = null;

async function loadData() {
  const res = await Promise.all([
    fetch('data/controllers.json').then(r => r.json()).catch(() => ({controllers: []})),
    fetch('data/rainbird.json').then(r => r.json()).catch(() => ({controllers: []})),
    fetch('data/checklist.json').then(r => r.json()).catch(() => ({seasons: {}})),
  ]);
  CONTROLLERS = [...(res[0].controllers || []), ...(res[1].controllers || [])];
  CHECKLIST = res[2];
  document.querySelector('#dataInfo').textContent =
    `Schedule generated ${res[0].generated_at || 'unknown'} · ${res[0].source || ''}`;
}

// ==================== Time helpers ====================
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function hhmmToMin(s) { if (!s) return 0; const [h,m]=s.split(':').map(Number); return h*60+m; }
function fmtTime12(min) {
  min = ((min % 1440) + 1440) % 1440;
  const h=Math.floor(min/60), m=min%60;
  const p = h<12 ? 'AM' : 'PM'; const d = h%12 || 12;
  return `${d}:${m.toString().padStart(2,'0')} ${p}`;
}
function fmtDur(min) {
  if (min < 60) return `${min} min`;
  const h=Math.floor(min/60), m=min%60;
  return m ? `${h}h ${m}m` : `${h}h`;
}
function nowMinutes() { const d=new Date(); return d.getHours()*60 + d.getMinutes(); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ==================== Compute run events ====================
// For each controller → program → start_time → ordered stations,
// produce event {start, end, controller, program, zone, duration_min, budgeted_min}.
// Stations with duration 0 are skipped (cursor doesn't advance).
function computeEvents(controllers) {
  const events = [];
  for (const c of controllers) {
    for (const p of (c.programs || [])) {
      const budget = p.water_budget != null ? p.water_budget : 100;
      for (const st of (p.start_times || [])) {
        let cursor = hhmmToMin(st);
        for (const s of (p.stations || [])) {
          if (s.duration_min == null || s.duration_min <= 0) continue;
          const budgeted = Math.round(s.duration_min * (budget/100));
          events.push({
            start: cursor,
            end: cursor + budgeted,
            controller: c.name,
            controller_id: c.id,
            controller_type: c.type,
            program: p.name,
            program_id: p.id,
            zone_num: s.number,
            zone_name: s.name,
            duration_min: s.duration_min,
            budgeted_min: budgeted,
            budget,
          });
          cursor += budgeted;
        }
      }
    }
  }
  events.sort((a,b) => a.start - b.start);
  return events;
}

// ==================== Conflict detection ====================
const BUFFER_MIN = 30;
function detectConflicts(events) {
  const conflicts = [];
  for (let i = 0; i < events.length; i++) {
    for (let j = i+1; j < events.length; j++) {
      const a = events[i], b = events[j];
      // Skip same program — sequential is by design
      if (a.program_id === b.program_id) continue;
      // Compute overlap and gap
      const overlap = Math.max(0, Math.min(a.end, b.end) - Math.max(a.start, b.start));
      const gap = overlap > 0 ? -overlap : (Math.max(a.start, b.start) - Math.min(a.end, b.end));
      if (overlap > 0 || gap < BUFFER_MIN) {
        const earlier = a.start <= b.start ? a : b;
        const later = a.start <= b.start ? b : a;
        conflicts.push({
          a: earlier, b: later,
          overlap, gap,
          severity: overlap > 0 ? 'danger' : (gap < 10 ? 'danger' : 'warn'),
        });
      }
    }
  }
  // Sort: overlaps first, then smallest gaps
  conflicts.sort((x, y) => {
    if (x.overlap !== y.overlap) return y.overlap - x.overlap;
    return x.gap - y.gap;
  });
  return conflicts;
}

// ==================== Today view ====================
function renderToday() {
  const root = $('#today-view');
  const events = computeEvents(CONTROLLERS);
  const conflicts = detectConflicts(events);
  const conflictedEventIds = new Set();
  for (const c of conflicts) {
    conflictedEventIds.add(eventId(c.a) + (c.severity === 'danger' ? '-danger' : '-warn'));
    conflictedEventIds.add(eventId(c.b) + (c.severity === 'danger' ? '-danger' : '-warn'));
  }

  root.innerHTML = '';
  // View toggle
  const toggle = document.createElement('div');
  toggle.className = 'view-toggle';
  toggle.innerHTML = `<button class="active" data-sub="list">List</button><button data-sub="gantt">Gantt</button>`;
  root.appendChild(toggle);

  const subroot = document.createElement('div');
  subroot.id = 'today-sub';
  root.appendChild(subroot);

  function renderSub(which) {
    subroot.innerHTML = '';
    if (which === 'list') renderEventList(subroot, events, conflictedEventIds);
    else renderGantt(subroot, events, conflictedEventIds);
  }

  toggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    $$('button', toggle).forEach(b => b.classList.toggle('active', b === btn));
    renderSub(btn.dataset.sub);
  });
  renderSub('list');
}

function eventId(e) { return `${e.controller_id}|${e.program_id}|${e.zone_num}|${e.start}`; }

function renderEventList(root, events, conflictedIds) {
  if (!events.length) {
    root.innerHTML = '<div class="loading" style="padding:30px">No scheduled events. Add controller data and refresh.</div>';
    return;
  }
  const now = nowMinutes();
  let lastHour = -999;
  for (const e of events) {
    const h = Math.floor(e.start / 60);
    if (h !== lastHour) {
      const div = document.createElement('div');
      div.className = 'tl-hour';
      const nowH = Math.floor(now/60);
      if (h === nowH) div.classList.add('now');
      const period = h < 12 ? 'AM' : 'PM';
      div.textContent = `${h%12 || 12} ${period}`;
      root.appendChild(div);
      lastHour = h;
    }
    const ev = document.createElement('div');
    ev.className = 'event';
    const isDanger = conflictedIds.has(eventId(e) + '-danger');
    const isWarn = conflictedIds.has(eventId(e) + '-warn');
    if (isDanger) ev.classList.add('has-conflict');
    else if (isWarn) ev.classList.add('warn-conflict');
    if (Math.abs(e.start - now) < 15) ev.classList.add('now-event');
    const isNow = e.start <= now && now < e.end;
    const nowTag = isNow ? `<span class="now-tag">NOW</span>` : '';
    const budgetNote = e.budget !== 100 ? ` <span class="duration-budgeted">@${e.budget}%</span>` : '';
    ev.innerHTML = `
      <div class="time-col">
        <div class="time">${fmtTime12(e.start)}</div>
        <div class="time-end">→ ${fmtTime12(e.end)}</div>
      </div>
      <div class="body">
        <div class="name">${escapeHtml(e.controller)}${nowTag}</div>
        <div class="ctx">${escapeHtml(e.program)} · S${e.zone_num} ${escapeHtml(e.zone_name)}</div>
      </div>
      <div class="right">
        <div class="dur">${fmtDur(e.budgeted_min)}${budgetNote}</div>
      </div>
    `;
    root.appendChild(ev);
  }
}

function renderGantt(root, events, conflictedIds) {
  // Order: controllers with events first (event order), then any zero-event controllers
  const controllerOrder = [];
  const seen = new Set();
  for (const e of events) {
    if (!seen.has(e.controller_id)) {
      seen.add(e.controller_id);
      controllerOrder.push({id: e.controller_id, name: e.controller});
    }
  }
  for (const c of CONTROLLERS) {
    if (!seen.has(c.id)) controllerOrder.push({id: c.id, name: c.name});
  }
  if (!controllerOrder.length) {
    root.innerHTML = '<div class="loading" style="padding:30px">No controllers loaded.</div>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'gantt-wrap';
  const grid = document.createElement('div');
  grid.className = 'gantt';

  // Axis row
  const axisRow = document.createElement('div');
  axisRow.className = 'gantt-axis-row';
  axisRow.innerHTML = `<div class="gantt-axis-spacer"></div><div class="gantt-axis-hours"></div>`;
  const axisHours = axisRow.querySelector('.gantt-axis-hours');
  for (let h = 0; h < 24; h++) {
    const span = document.createElement('span');
    span.textContent = `${h%12||12}${h<12?'a':'p'}`;
    axisHours.appendChild(span);
  }
  grid.appendChild(axisRow);

  // Rows
  for (const c of controllerOrder) {
    const row = document.createElement('div');
    row.className = 'gantt-row';

    const label = document.createElement('div');
    label.className = 'gantt-label';
    label.textContent = c.name;
    label.title = c.name;
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'gantt-track';
    const ctlEvents = events.filter(e => e.controller_id === c.id);
    for (const e of ctlEvents) {
      const block = document.createElement('div');
      block.className = 'gantt-block';
      const isDanger = conflictedIds.has(eventId(e) + '-danger');
      const isWarn = conflictedIds.has(eventId(e) + '-warn');
      if (isDanger) block.classList.add('conflict');
      else if (isWarn) block.classList.add('warn');
      const startPct = (e.start / 1440) * 100;
      const widthPct = ((e.end - e.start) / 1440) * 100;
      block.style.left = `${startPct}%`;
      block.style.width = `${widthPct}%`;
      block.title = `${e.controller} / ${e.program} S${e.zone_num} ${fmtTime12(e.start)}–${fmtTime12(e.end)} (${fmtDur(e.budgeted_min)})`;
      block.textContent = `S${e.zone_num}`;
      track.appendChild(block);
    }
    row.appendChild(track);
    grid.appendChild(row);
  }

  wrap.appendChild(grid);
  root.appendChild(wrap);

  const note = document.createElement('div');
  note.className = 'subtle';
  note.style.cssText = 'margin-top:10px;text-align:center';
  note.textContent = '← scroll horizontally →';
  root.appendChild(note);
}

// ==================== Conflicts view ====================
function renderConflicts() {
  const root = $('#conflicts-view');
  const events = computeEvents(CONTROLLERS);
  const conflicts = detectConflicts(events);
  root.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `<span>${conflicts.length} ${conflicts.length === 1 ? 'conflict' : 'conflicts'} · ${BUFFER_MIN}-min buffer rule</span>`;
  root.appendChild(head);

  if (!conflicts.length) {
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.style.cssText = 'background:var(--panel);border:1px solid var(--accent);color:var(--accent);padding:18px;border-radius:12px;text-align:center;font-weight:600';
    empty.textContent = '✓ No conflicts. Schedule is clean.';
    root.appendChild(empty);
    return;
  }

  const ul = document.createElement('ul');
  ul.className = 'cards';
  for (const c of conflicts) {
    const li = document.createElement('li');
    li.className = `card conflict-card ${c.severity === 'warn' ? 'warn' : ''}`;
    const gapText = c.overlap > 0
      ? `Overlap ${fmtDur(c.overlap)}`
      : `${fmtDur(c.gap)} gap (want ${BUFFER_MIN})`;
    li.innerHTML = `
      <div class="title">${escapeHtml(c.a.controller)} <span class="subtle">/ ${escapeHtml(c.a.program)} S${c.a.zone_num}</span></div>
      <div class="meta">${fmtTime12(c.a.start)} – ${fmtTime12(c.a.end)}</div>
      <div class="pair">
        <span class="arrow">↓</span>
        <span class="gap-label">${gapText}</span>
      </div>
      <div class="title" style="margin-top:6px">${escapeHtml(c.b.controller)} <span class="subtle">/ ${escapeHtml(c.b.program)} S${c.b.zone_num}</span></div>
      <div class="meta">${fmtTime12(c.b.start)} – ${fmtTime12(c.b.end)}</div>
    `;
    ul.appendChild(li);
  }
  root.appendChild(ul);
}

// ==================== Controllers view ====================
function renderControllers() {
  const root = $('#controllers-view');
  root.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.textContent = `${CONTROLLERS.length} controllers`;
  root.appendChild(head);

  for (const c of CONTROLLERS) {
    const card = document.createElement('div');
    card.className = 'ctl-card';
    const isPlaceholder = !(c.programs || []).some(p => (p.start_times || []).length > 0);
    if (isPlaceholder) card.classList.add('placeholder');

    const totalRuntime = (c.programs || []).reduce((sum, p) => {
      const perRun = (p.stations || []).reduce((s, st) => s + (st.duration_min || 0), 0);
      return sum + perRun * (p.start_times || []).length * ((p.water_budget || 100)/100);
    }, 0);
    const startCount = (c.programs || []).reduce((s, p) => s + (p.start_times || []).length, 0);

    card.innerHTML = `
      <h3>${escapeHtml(c.name)}<span class="ctl-type ${c.type}">${(c.type||'').toUpperCase()}</span></h3>
      ${c.notes ? `<div class="subtle">${escapeHtml(c.notes)}</div>` : ''}
      <div class="ctl-summary">
        <span class="stat">${(c.programs || []).length} programs</span>
        <span class="stat">${startCount} start times/day</span>
        <span class="stat">${Math.round(totalRuntime)} min/day total</span>
      </div>
      <div class="programs"></div>
    `;
    const progRoot = card.querySelector('.programs');
    for (const p of (c.programs || [])) {
      const pb = document.createElement('div');
      pb.className = 'program-block';
      const startList = (p.start_times || []).map(s => fmtTime12(hhmmToMin(s))).join(', ') || '—';
      const zonesHTML = (p.stations || []).map(s =>
        `<span class="zone${s.duration_min === 0 ? ' skip' : ''}">S${s.number}: ${s.duration_min || 0}m</span>`
      ).join('');
      pb.innerHTML = `
        <div class="pname">${escapeHtml(p.name)} <span class="subtle">· budget ${p.water_budget != null ? p.water_budget : 100}%</span></div>
        <div class="pdetail">Starts: ${startList} · Days: ${(p.days||[]).length === 7 ? 'every day' : (p.days||[]).join(', ') || '—'}</div>
        <div class="pzones">${zonesHTML || '<span class="subtle">No zones configured</span>'}</div>
      `;
      progRoot.appendChild(pb);
    }
    root.appendChild(card);
  }
}

// ==================== Checklist view ====================
function getCurrentSeason() {
  const m = new Date().getMonth(); // 0-indexed
  if (m <= 1 || m === 11) return 'winter';   // Dec, Jan, Feb
  if (m <= 4) return 'spring';                // Mar, Apr, May
  if (m <= 7) return 'summer';                // Jun, Jul, Aug
  return 'fall';                              // Sep, Oct, Nov
}
let CURRENT_SEASON = getCurrentSeason();
const CHECKLIST_YEAR = new Date().getFullYear();

function checklistKey() { return `pike-irrig:checklist:${CHECKLIST_YEAR}:${CURRENT_SEASON}`; }
function loadChecklistState() {
  try { return JSON.parse(localStorage.getItem(checklistKey()) || '{}'); }
  catch { return {}; }
}
function saveChecklistState(state) { localStorage.setItem(checklistKey(), JSON.stringify(state)); }

function expandChecklistItems(season) {
  // Expand each item by scope. Each expanded item carries controller_id (or null for global)
  // and a per-row label (zone-scoped items get "Program · S2", controller-scoped get just the item text).
  const expanded = [];
  for (const item of (CHECKLIST?.seasons?.[season]?.items || [])) {
    if (item.scope === 'global') {
      expanded.push({
        ...item, key: `${item.id}|global`,
        controller_id: null, controller_name: null,
        rowLabel: item.text, sublabel: null,
      });
    } else if (item.scope === 'controller') {
      for (const c of CONTROLLERS) {
        expanded.push({
          ...item, key: `${item.id}|${c.id}`,
          controller_id: c.id, controller_name: c.name,
          rowLabel: item.text, sublabel: null,
        });
      }
    } else if (item.scope === 'zone') {
      for (const c of CONTROLLERS) {
        for (const p of (c.programs || [])) {
          for (const s of (p.stations || [])) {
            if (s.duration_min === 0) continue;
            const ref = `${c.id}|${p.id}|${s.number}`;
            expanded.push({
              ...item, key: `${item.id}|${ref}`,
              controller_id: c.id, controller_name: c.name,
              rowLabel: item.text,
              sublabel: `${p.name} · S${s.number} ${s.name}`,
            });
          }
        }
      }
    }
  }
  return expanded;
}

function renderChecklist() {
  const root = $('#checklist-view');
  root.innerHTML = '';

  if (!CHECKLIST?.seasons) {
    root.innerHTML = '<div class="loading">No checklist data</div>';
    return;
  }

  // Season tabs
  const tabs = document.createElement('div');
  tabs.className = 'season-tabs';
  for (const [key, s] of Object.entries(CHECKLIST.seasons)) {
    const btn = document.createElement('button');
    if (key === CURRENT_SEASON) btn.classList.add('active');
    btn.textContent = `${s.icon || ''} ${s.label}`;
    btn.addEventListener('click', () => { CURRENT_SEASON = key; renderChecklist(); });
    tabs.appendChild(btn);
  }
  root.appendChild(tabs);

  const items = expandChecklistItems(CURRENT_SEASON);
  let state = loadChecklistState();

  // Progress
  const done = items.filter(i => state[i.key]).length;
  const prog = document.createElement('div');
  prog.className = 'checklist-progress';
  prog.textContent = `${done} / ${items.length} done · ${CHECKLIST.seasons[CURRENT_SEASON].label} ${CHECKLIST_YEAR}`;
  root.appendChild(prog);

  // Group by controller (with a "Global" pseudo-group at the top for global items).
  // Within each controller group: controller-scoped items first, then zone-scoped.
  const globalItems = items.filter(i => i.controller_id === null);
  const byCtl = new Map();
  for (const it of items) {
    if (it.controller_id === null) continue;
    if (!byCtl.has(it.controller_id)) byCtl.set(it.controller_id, { name: it.controller_name, items: [] });
    byCtl.get(it.controller_id).items.push(it);
  }
  // Sort each controller's items: scope=controller first, then zone, preserving original order otherwise
  for (const v of byCtl.values()) {
    v.items.sort((a, b) => {
      const ord = { 'controller': 0, 'zone': 1, 'global': 2 };
      return (ord[a.scope] ?? 99) - (ord[b.scope] ?? 99);
    });
  }

  function renderItemRow(it) {
    const row = document.createElement('div');
    row.className = 'check-item' + (state[it.key] ? ' done' : '');
    row.innerHTML = `
      <div class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div style="flex:1;min-width:0">
        <div class="text">${escapeHtml(it.rowLabel)}</div>
        ${it.sublabel ? `<div class="scope-tag">${escapeHtml(it.sublabel)}</div>` : ''}
      </div>
    `;
    row.addEventListener('click', () => {
      state = loadChecklistState();
      if (state[it.key]) delete state[it.key]; else state[it.key] = true;
      saveChecklistState(state);
      renderChecklist();
    });
    return row;
  }

  // Global section
  if (globalItems.length) {
    const g = document.createElement('div');
    g.className = 'check-group';
    const head = document.createElement('div');
    head.className = 'group-name';
    head.textContent = 'Global';
    g.appendChild(head);
    for (const it of globalItems) g.appendChild(renderItemRow(it));
    root.appendChild(g);
  }

  // Per-controller sections, in CONTROLLERS order
  for (const c of CONTROLLERS) {
    const grp = byCtl.get(c.id);
    if (!grp || !grp.items.length) continue;
    const g = document.createElement('div');
    g.className = 'check-group';
    const doneHere = grp.items.filter(i => state[i.key]).length;
    const head = document.createElement('div');
    head.className = 'group-name';
    head.innerHTML = `${escapeHtml(c.name)} <span class="subtle" style="font-weight:400">${doneHere}/${grp.items.length}</span>`;
    g.appendChild(head);
    for (const it of grp.items) g.appendChild(renderItemRow(it));
    root.appendChild(g);
  }

  // Reset button at bottom
  const resetWrap = document.createElement('div');
  resetWrap.style.cssText = 'margin-top:18px;text-align:center';
  resetWrap.innerHTML = `<button class="btn" id="resetSeasonBtn" style="background:var(--panel-2);color:var(--muted);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer">Reset ${CHECKLIST.seasons[CURRENT_SEASON].label} ${CHECKLIST_YEAR}</button>`;
  root.appendChild(resetWrap);
  $('#resetSeasonBtn').addEventListener('click', () => {
    if (!confirm(`Reset all ${CHECKLIST.seasons[CURRENT_SEASON].label} ${CHECKLIST_YEAR} checks?`)) return;
    saveChecklistState({});
    renderChecklist();
  });
}

// ==================== Header pills ====================
function updateHeaderPills() {
  const events = computeEvents(CONTROLLERS);
  const conflicts = detectConflicts(events);
  const pill = $('#conflictPill');
  if (!conflicts.length) {
    pill.className = 'pill';
    pill.textContent = `${events.length} runs · clean`;
  } else {
    pill.className = 'pill ' + (conflicts.some(c => c.severity === 'danger') ? 'danger' : 'warn');
    pill.textContent = `${conflicts.length} ${conflicts.length === 1 ? 'conflict' : 'conflicts'}`;
  }
  // Bottom nav badge
  const navConflict = $('nav.bottomnav button[data-view="conflicts"]');
  if (conflicts.length) {
    navConflict.classList.add('has-conflicts');
    navConflict.querySelector('.badge').textContent = conflicts.length;
  } else {
    navConflict.classList.remove('has-conflicts');
  }
}

// ==================== Routing / render ====================
let CURRENT_VIEW = 'today';
function showView(name) {
  CURRENT_VIEW = name;
  $$('section.view').forEach(s => s.classList.toggle('active', s.id === `${name}-view`));
  $$('nav.bottomnav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if (name === 'today') renderToday();
  else if (name === 'conflicts') renderConflicts();
  else if (name === 'controllers') renderControllers();
  else if (name === 'checklist') renderChecklist();
}

document.querySelectorAll('nav.bottomnav button').forEach(b => {
  b.addEventListener('click', () => showView(b.dataset.view));
});

// Date / clock
function updateClock() {
  const d = new Date();
  $('#dateLabel').textContent = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  $('#clockLabel').textContent = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}
updateClock(); setInterval(updateClock, 30000);

// Initial load
loadData().then(() => {
  updateHeaderPills();
  showView('today');
}).catch(err => {
  $('#today-view').innerHTML = `<div class="loading">Failed to load data: ${escapeHtml(err.message)}<br><br>If you opened this from <code>file://</code>, host it via GitHub Pages or run <code>python3 -m http.server</code> in the folder.</div>`;
});

// Service worker
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
